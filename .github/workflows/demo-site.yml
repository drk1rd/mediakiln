name: Demo site

# Builds examples/plain-html with mediakiln and publishes the finished static site to the
# `demo-site` branch, which Cloudflare Pages serves as-is (no build step on Cloudflare).
# The branch is force-pushed as a single commit, so media never piles up in git history.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "examples/plain-html/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/demo-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci --ignore-scripts && npm run build
      - name: Build the demo site
        env:
          # Optional repository variable, e.g. https://mediakiln.pages.dev (absolute og:image)
          MEDIAKILN_SITE: ${{ vars.DEMO_SITE_URL }}
        run: bash examples/plain-html/build-site.sh
      - name: Publish to the demo-site branch
        working-directory: examples/plain-html/site
        run: |
          git init -q -b demo-site
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo site built from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" demo-site
